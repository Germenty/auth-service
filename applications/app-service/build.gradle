apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${
	testImplementation 'com.fasterxml.jackson.core:jackson-databind'springBootVersion}"
    }
}

dependencies {
    implementation project(':reactive-web')
    implementation project(':model')
    implementation project(':usecase')
    
    // Spring Boot Starters necesarios para Spring Boot 3.x
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    
    // R2DBC PostgreSQL driver para Spring Boot 3.x
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Testing (evitamos duplicados con main.gradle)
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    // To disable the *-plain.jar
    enabled = false
}

bootJar {
    // Sets output jar name
    archiveFileName = "${project.getParent().getName()}.${archiveExtension.get()}"
}